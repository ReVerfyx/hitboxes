# Minecraft / mapping / loader versions — targeting 1.16.5 baseline.
# Bump minecraft_version to build against a newer 1.16.5+ release.
minecraft_version=1.16.5
yarn_mappings=1.16.5+build.10
loader_version=0.11.6

# Exact patch pins for the 1.16 branch have twice not existed on Fabric's
# Maven (0.34.11, 0.34.9 both 404). Use a range instead of guessing again —
# Gradle resolves it against Fabric's real published metadata at build time.
fabric_version=[0.32.0+1.16,0.40.0+1.16]

mod_version=0.1.0
maven_group=com.local
archives_base_name=hitboxdebug

org.gradle.jvmargs=-Xmx1G
