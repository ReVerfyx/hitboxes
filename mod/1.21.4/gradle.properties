# Minecraft / mapping / loader versions — targeting 1.21.4.
minecraft_version=1.21.4

# Yarn mapping builds get bumped repeatedly for corrections after a
# Minecraft version's own release, so — same reasoning as the 1.16.5
# module's fabric_version range — an open-ish range instead of one exact
# build number avoids guessing which patch is the real latest one.
yarn_mappings=[1.21.4+build.1,1.21.4+build.99]

# Fabric Loader is decoupled from the Minecraft version it targets, so an
# open lower-bound range (rather than an exact patch pin) resolves to
# whatever the latest real published loader build is at build time — same
# reasoning as the 1.16.5 module's fabric_version range, applied to loader
# here since loader itself has no per-Minecraft-version suffix to range on.
loader_version=[0.16.0,)

# Fabric API version strings embed the target Minecraft version as a
# "+1.21.4" suffix, so the range is scoped to that suffix with an open
# upper bound — resolves to the latest real 0.1xx.y+1.21.4 build Fabric
# has published, without guessing an exact patch number.
fabric_version=[0.110.0+1.21.4,)

mod_version=0.1.0
maven_group=com.local
archives_base_name=hitboxdebug

org.gradle.jvmargs=-Xmx2G
