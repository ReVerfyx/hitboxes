# Minecraft / mapping / loader versions — targeting 1.21.4.
minecraft_version=1.21.4

# Loom resolves the "mappings" dependency itself rather than through
# normal lazy Configuration resolution, so neither a Maven bracket range
# nor a "+" wildcard works here ("Could not resolve mappings") the way
# they do for modImplementation dependencies below — it needs one exact,
# real published version. Confirmed via https://meta.fabricmc.net/v2/versions/yarn/1.21.4
# (highest "build" in the response) — bump this by hand if Yarn publishes
# a newer build later.
yarn_mappings=1.21.4+build.8

# Fabric Loader is decoupled from the Minecraft version it targets, so an
# open lower-bound range (rather than an exact patch pin) resolves to
# whatever the latest real published loader build is at build time — same
# reasoning as the 1.16.5 module's fabric_version range, applied to loader
# here since loader itself has no per-Minecraft-version suffix to range on.
loader_version=[0.16.0,)

# Exact pin, not an open range: the latest fabric-api (0.119.4+1.21.4)
# ships an access-widener/"class tweaker" that Loom 1.17.20 (and even the
# 1.18.0-alpha.19 snapshot) fails to remap ("Cannot remap access widener
# from namespace 'official'. Expected: 'intermediary'" — a Loom
# AccessWidenerJarProcessor stack trace, not anything project-specific).
# 0.110.0+1.21.4 is an earlier, known-good build from before whatever
# introduced that widener format.
fabric_version=0.110.0+1.21.4

mod_version=0.1.0
maven_group=com.local
archives_base_name=hitboxdebug

org.gradle.jvmargs=-Xmx2G
